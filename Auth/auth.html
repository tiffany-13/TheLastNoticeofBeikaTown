<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Last Notice of Beika Town | Log In Sign Up</title>
    <link rel="stylesheet" href="auth.css">
    <script type="module"
            src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
    </script>
</head>

<body>
    <div id="header"></div>
    <main class="auth-page">
        <div class="scene" aria-hidden="true">
            <div class="scene-grid"></div>

            <div class="model-stage">
                <video class="conan-video"
                       autoplay
                       loop
                       muted
                       playsinline>
                    <source src="../assets/Others/conan_rotate.webm" type="video/webm">
                </video>
            </div>
        </div>

        <section class="auth-box" aria-labelledby="authTitle">
            <div class="case-number">CASE NO 001</div>

            <span class="auth-label">BEIKA TOWN INVESTIGATION SYSTEM</span>
            <h1 id="authTitle">LOGIN</h1>
            <div class="auth-line"></div>

            <p class="auth-intro">
                Sign in to inspect evidence, review case files, and uncover the truth.
            </p>

            <form id="loginForm">
                <label for="loginUsername">DETECTIVE NAME</label>
                <input type="text"
                       id="loginUsername"
                       placeholder="ENTER USERNAME"
                       autocomplete="username"
                       required>

                <label for="loginPassword">ACCESS CODE</label>
                <input type="password"
                       id="loginPassword"
                       placeholder="ENTER PASSWORD"
                       autocomplete="current-password"
                       required>

                <p id="loginMessage" role="alert"></p>

                <button type="submit" class="auth-button">
                    <span>LOG IN</span>
                    <span aria-hidden="true">→</span>
                </button>
            </form>

            <form id="signupForm">
                <label for="signupUsername">DETECTIVE NAME</label>
                <input type="text"
                       id="signupUsername"
                       placeholder="CHOOSE USERNAME"
                       autocomplete="username"
                       required>

                <label for="signupPassword">CREATE ACCESS CODE</label>
                <input type="password"
                       id="signupPassword"
                       placeholder="CREATE PASSWORD"
                       autocomplete="new-password"
                       required>

                <label for="signupConfirmPassword">CONFIRM ACCESS CODE</label>
                <input type="password"
                       id="signupConfirmPassword"
                       placeholder="RE-ENTER PASSWORD"
                       autocomplete="new-password"
                       required>

                <p id="signupMessage" role="alert"></p>

                <button type="submit" class="auth-button">
                    <span>REGISTER AS DETECTIVE</span>
                    <span aria-hidden="true">→</span>
                </button>
            </form>

            <button type="button" class="auth-switch" id="authSwitch">
                FIRST CASE? REGISTER AS A DETECTIVE
            </button>
        </section>
    </main>

    <script src="auth.js"></script>
    <script src="../Components/header.js"></script>
</body>
</html>
